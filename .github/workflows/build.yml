name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TeamsCustomMute.sln

      - name: Build
        run: dotnet build TeamsCustomMute.sln -c Release --no-restore

      - name: Build menu regression tests
        run: dotnet build tests/TeamsCustomMuteWeb.Tests/TeamsCustomMuteWeb.Tests.csproj -c Release

      - name: Install test browser
        shell: pwsh
        run: ./tests/TeamsCustomMuteWeb.Tests/bin/Release/net10.0-windows/playwright.ps1 install chromium

      - name: Test menu compatibility
        run: dotnet test tests/TeamsCustomMuteWeb.Tests/TeamsCustomMuteWeb.Tests.csproj -c Release --no-build
